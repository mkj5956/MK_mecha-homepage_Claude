      <p class="muted" id="loginMsg" style="margin-top:10px"></p>

  <header class="top">

      </nav>

  <div class="admin">

      <a href="#/settings" data-nav="settings">⚙️ 설정</a>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <script type="module" src="js/admin.js"></script>
